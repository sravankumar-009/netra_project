<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main
     style="background:linear-gradient(135deg,#dbeafe,#fce7f3,#d1fae5);padding:16px;font-family:'poppins',sans-serif;color:#475569;">
<div style="background:linear-gradient(135deg,#115e59,#99f6e4,#115e59);color:white;padding:18px;border-radius:16px;text-align:center;">
<h1 style="margin:0;">Student Portfolio</h1>
</div>

<section style="background:#ffffff;padding:16px;margin-top:12px;border-radius:16px;box-shadow:0 6px 12px #99f6e4;text-align: center;">
<h2>About Me</h2>
<img src="profile.jpg" alt="BhagyaShri" width="100" height="100" style="border-radius:50%;border:3px solid #f0fdfa;">
<p style="margin:8px 0 0;">Bhagya Shri | CSE Student</p>
</section>

<section style="background:#ffffff;padding:16px;margin-top:12px;border-radius:16px;box-shadow:0 6px 12px #99f6e4;">
<h2>My Skills</h2>
<ul style="display:flex;gap:8px;list-style:none;padding:0;">
<li style="background:#ccfbf1;color:#115e59;padding:8px 14px;border-radius:20px;">HTML</li>
<li style="background:#ccfbf1;color:#115e59;padding:8px 14px;border-radius:20px;">Python</li>
</ul>
</section>

<section style="background:white;padding:16px;margin-top:12px;border-radius:16px;border-left:4px solid #14b8a6;box-shadow:0 6px 12px #99f6e4;">
<h2>My Projects</h2>
<p>Registration Form • Library Page</p>
</section>

<section style="background:white;padding:16px;margin-top:12px;border-radius:16px;box-shadow:0 6px 12px #99f6e4;">
<h2 style="margin:0 0 12px;font-size:20px;">Course Registration</h2>

<form>
<label for="name">Full Name</label><br>
<input id="name" name="name" type="text" required style="box-sizing:border-box;width:100%;padding:10px;margin:6px 0 12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px;">

<label for="email">Email</label><br>
<input id="email" name="email" type="email" required style="box-sizing:border-box;width:100%;padding:10px;margin:6px 0 12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px;">

<label for="course">Course</label><br>
<select id="course" name="course" style="box-sizing:border-box;width:100%;padding:10px;margin:6px 0 12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px;">
<option>HTML</option>
<option>Python</option>
</select>

<p>Learning Mode:</p>
<label><input type="radio" name="mode" value="online">Online</label>
<label><input type="radio" name="mode" value="offline">Offline</label>

<label for="comments">Comments</label><br>
<textarea id="comments" name="comments" rows="2" style="box-sizing:border-box;width:100%;padding:10px;margin:6px 0 12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px;"></textarea>

<p><label><input type="checkbox" name="agree">I agree</label></p>

<button type="submit" style="background:#115e59;color:white;padding:10px 18px;border:0;border-radius:9px;">Register</button>

<button type="reset" style="background:#e2e8f0;color:#14b8a6;padding:10px 18px;border:0;border-radius:9px;">Reset</button>
</form>
</section>

<section style="background:white;padding:16px;margin-top:12px;border-radius:16px;box-shadow:0 6px 12px #99f6e4;">
<h2>Contact</h2>
<a href="mailto:ananya@example.com" style="display:inline-block;background:#ccfbf1;color:#14b8a6;padding:8px 16px;border-radius:20px;text-decoration:none;">Email Me</a>
</section>
</main>

</body>
</html>
